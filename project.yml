name: BananaBlitz

options:
  bundleIdPrefix: com.bananablitz
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # Refresh the shared Settings, menu and About code before the project is generated.
  preGenCommand: python3 .project/mac_surfaces.py sync

settings:
  base:
    DEVELOPMENT_TEAM: "6S9Q286XS9"
    SWIFT_VERSION: "5"
    DEAD_CODE_STRIPPING: YES
    # Sandbox custom Run Script build phases. Free correctness win — no
    # current scripts depend on out-of-sandbox access.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Auto-generate Swift symbols for .xcstrings files (when we add them).
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # Asset-symbol extensions are intentionally NOT generated — flip to YES
    # if you want type-safe `Image.gitHub` accessors alongside the existing
    # `Image("GitHub")` calls.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  BananaBlitz:
    type: application
    platform: macOS
    sources:
      - path: BananaBlitz
        excludes:
          - "Info.plist"
          - "BananaBlitz.entitlements"
      - path: Scripts/unbrick.sh
        buildPhase: resources
    dependencies:
      - package: Sparkle
    settings:
      base:
        INFOPLIST_FILE: $(DERIVED_FILE_DIR)/BuildIdentity-Info.plist
        CODE_SIGN_ENTITLEMENTS: BananaBlitz/BananaBlitz.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.bananablitz.app
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

        BUILD_IDENTITY_SOURCE_PLIST: $(SRCROOT)/BananaBlitz/Info.plist
    preBuildScripts:
      - name: Prepare version and build identity
        script: env -u SDKROOT /usr/bin/python3 "$SRCROOT/Scripts/prepare-build-info.py" plist
        inputFiles:
          - $(SRCROOT)/Scripts/prepare-build-info.py
          - $(PROJECT_TEMP_DIR)/BuildIdentity.plist
          - $(SRCROOT)/BananaBlitz/Info.plist
        outputFiles:
          - $(DERIVED_FILE_DIR)/BuildIdentity-Info.plist
        basedOnDependencyAnalysis: false
  BananaBlitzTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BananaBlitzTests
    dependencies:
      - target: BananaBlitz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bananablitz.tests
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BananaBlitz:
    build:
      targets:
        BananaBlitz: all
        BananaBlitzTests: [test]
      preActions:
        - name: Capture shared build identity
          settingsTarget: BananaBlitz
          script: env -u SDKROOT /usr/bin/python3 "$SRCROOT/Scripts/prepare-build-info.py" session
    test:
      targets:
        - BananaBlitzTests
      gatherCoverageData: true
    run:
      config: Debug
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
fileGroups:
  - Scripts
  - Config/Shared.xcconfig
