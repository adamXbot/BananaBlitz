name: Release

# Thin caller — the actual pipeline (test gate → sign → notarize → DMG →
# appcast → GitHub Release → Homebrew cask PR) lives in
# privacykey/gh-workflows (.github/workflows/macos-sparkle-release.yml),
# pinned to an exact commit like every other consumer. This repo owns
# only Scripts/release.sh, the version in Config/Shared.xcconfig and the
# cask template in packaging/homebrew/. See docs/RELEASES.md for the
# secret layout and the release-script contract.
#
# Secret scopes (names only; values live in GitHub):
#   • APPLE_* — repository secrets for this account's macOS apps.
#   • SPARKLE_PRIVATE_KEY — this repo (intended home: the macos-signing
#     environment). Environment secrets only resolve inside the called
#     workflow's release job — which declares `environment:
#     macos-signing` — so this caller MUST use `secrets: inherit`;
#     an explicit `secrets:` mapping resolves in the caller's context
#     (no environment) and would come back empty.
#   • HOMEBREW_TAP_TOKEN — optional; the cask-PR step skips cleanly
#     until it exists.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to release as (e.g. v1.0.1). Must match MARKETING_VERSION in Config/Shared.xcconfig.'
        required: true

# Deliberate duplication of the called workflow's concurrency block:
# GitHub evaluates workflow-level concurrency of a *called* workflow
# inconsistently, so both sides declare it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# A called workflow can only reduce the caller's token permissions,
# never raise them — contents: write is needed to publish the Release
# and push the appcast branch; checks: read lets the publication gates
# confirm the required CI checks at the tagged commit. Inside the
# reusable workflow the test job runs with contents: read; only its
# release job uses write.
permissions:
  checks: read
  contents: write

jobs:
  release:
    uses: privacykey/gh-workflows/.github/workflows/macos-sparkle-release.yml@17c26982bea3999cc60fbc18ac094b164319b9cd # Source provenance and project publication gates
    with:
      xcodeproj: BananaBlitz.xcodeproj
      scheme: BananaBlitz
      # The .xcodeproj is generated from project.yml; the committed copy
      # must match the generator's output or the clean-source gate fails.
      uses_xcodegen: true
      # The shared default is ./scripts/release.sh; this repo keeps its
      # scripts under Scripts/.
      release_script: ./Scripts/release.sh
      appcast_branch: gh-pages
      # Attach the dSYM to the public Release so anyone with a crash
      # log can symbolicate; the reusable default (false) would keep
      # symbols private-only.
      publish_dsym: true
      # Renders packaging/homebrew/bananablitz.rb and opens a PR against
      # adamxbot/homebrew-tap. Skips cleanly until the HOMEBREW_TAP_TOKEN
      # secret exists.
      cask_name: bananablitz
      tap_repo: adamxbot/homebrew-tap
      # Empty on tag pushes (the reusable workflow falls back to the
      # triggering ref name); set by workflow_dispatch re-releases.
      release_tag: ${{ inputs.release_tag || '' }}
    secrets: inherit
