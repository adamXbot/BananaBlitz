name: Release

# Thin caller for the shared release pipeline. All orchestration
# (test gate, keychain, notarization, appcast, GitHub Release, cask
# bump) lives in privacykey/gh-workflows; this repo owns only its
# build script (Scripts/release.sh) and the inputs below.
#
# Secrets are mapped EXPLICITLY (gen-3 names). This works because none
# of them live in a deployment environment yet — explicit mappings
# resolve in the caller's context, which has no environment. If
# SPARKLE_PRIVATE_KEY is later moved into the `macos-signing`
# environment (recommended), switch to `secrets: inherit` or the key
# will resolve empty. See the PR that introduced this file for the
# full secrets checklist.

on:
  push:
    tags:
      - 'v*'

# Deliberate duplication of the called workflow's concurrency: GitHub
# evaluates workflow-level concurrency of a *called* workflow
# inconsistently, so both sides declare it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# A called workflow can only reduce the caller's token permissions,
# never raise them, so the release job's `contents: write` (Release +
# appcast push) must be grantable from here.
permissions:
  contents: write

jobs:
  release:
    uses: privacykey/gh-workflows/.github/workflows/macos-sparkle-release.yml@v1
    with:
      xcodeproj: BananaBlitz.xcodeproj
      scheme: BananaBlitz
      uses_xcodegen: true
      release_script: ./Scripts/release.sh
      # Cask bump publishes packaging/homebrew/bananablitz.rb to the
      # tap. The step skips cleanly until the HOMEBREW_TAP_TOKEN
      # secret exists, so releases work before the tap wiring is done.
      cask_name: bananablitz
      tap_repo: adamxbot/homebrew-tap
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
