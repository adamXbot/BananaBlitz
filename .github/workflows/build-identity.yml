name: Build identity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 Scripts/test-buildinfo.py
      - run: python3 Scripts/test-build-identity.py
      - run: ruby Scripts/test-fastlane-identity.rb
      - run: python3 Scripts/test-archive-command.py
      - name: Verify account signing, API overrides and upload routing
        run: python3 -m unittest discover -s Scripts -p 'test_*signing.py'
