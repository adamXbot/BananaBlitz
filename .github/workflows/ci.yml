name: CI

# Thin caller for the shared push/PR pipeline (unsigned build + tests,
# zero secrets). Test output ships as an uploaded xcresult bundle.
# Release builds live in release.yml, triggered by `v*` tag pushes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deliberate duplication of the called workflow's concurrency: GitHub
# evaluates workflow-level concurrency of a *called* workflow
# inconsistently, so both sides declare it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: privacykey/gh-workflows/.github/workflows/macos-app-ci.yml@v1
    with:
      xcodeproj: BananaBlitz.xcodeproj
      scheme: BananaBlitz
      uses_xcodegen: true
