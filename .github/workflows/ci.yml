name: CI

# Thin caller for the shared push/PR pipeline (unsigned build + tests,
# zero secrets), pinned to the same exact commit as release.yml. Test
# output ships as an uploaded xcresult bundle. Release builds live in
# release.yml, triggered by `v*` tag pushes. The command contract and
# build-identity checks have their own workflows.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same ref/PR cancels an in-flight run. Declared here
# as well as in the called workflow — GitHub evaluates workflow-level
# concurrency of a *called* workflow inconsistently.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  checks: read
  contents: read

jobs:
  ci:
    uses: privacykey/gh-workflows/.github/workflows/macos-app-ci.yml@17c26982bea3999cc60fbc18ac094b164319b9cd # Source provenance and project publication gates
    with:
      xcodeproj: BananaBlitz.xcodeproj
      scheme: BananaBlitz
      uses_xcodegen: true
